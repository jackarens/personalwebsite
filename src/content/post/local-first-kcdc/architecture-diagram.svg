<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Sized 16:9 to match the slide canvas exactly. On a full-bleed slide that
       makes the diagram render 1:1, so the type below is the size the room
       actually sees; shrink the viewBox and every label shrinks with it. -->
  <!-- self-contained dark panel: diagram reads the same in light or dark decks -->
  <rect x="0" y="0" width="1280" height="720" rx="18" fill="#1b1f27" stroke="#333a45" stroke-width="2"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93a1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4caf50"/>
    </marker>
  </defs>

  <style>
    .node  { fill:#2c313b; stroke-width:2; }
    .ntxt  { font-size:24px; font-weight:600; text-anchor:middle; }
    .grp   { fill:none; stroke-width:2; stroke-dasharray:6 5; opacity:0.55; }
    .gtxt  { font-size:23px; font-weight:700; }
    .edge  { fill:none; stroke:#8b93a1; stroke-width:2.5; }
    .edgeg { fill:none; stroke:#4caf50; stroke-width:2.5; }
    .etxt  { fill:#b9c0ca; font-size:18px; }
    .etxtc { fill:#b9c0ca; font-size:18px; text-anchor:middle; }
    .num   { fill:#4caf50; font-weight:700; }
    .numn  { fill:#8b93a1; font-weight:700; }
  </style>

  <!-- ================= CONTAINERS ================= -->
  <rect class="grp" x="40" y="46" width="850" height="370" rx="14" stroke="#4caf50"/>
  <text class="gtxt" x="60" y="82" fill="#4caf50">Backend Infrastructure</text>

  <rect class="grp" x="40" y="456" width="1200" height="250" rx="14" stroke="#6f9fd8"/>
  <text class="gtxt" x="60" y="492" fill="#6f9fd8">Client Environment</text>

  <!-- ================= EDGES ================= -->
  <!-- 1. Push -> Transaction -->
  <path class="edgeg" marker-end="url(#arrowg)" d="M240,166 C290,186 310,196 330,214"/>
  <text class="etxt" x="330" y="196" text-anchor="end"><tspan class="num">1.</tspan> Send Mutations</text>

  <!-- Direct write: External -> Transaction -->
  <path class="edge" marker-end="url(#arrow)" d="M990,150 L720,150 L676,196"/>
  <text class="etxtc" x="828" y="138">Direct Write (via Tx Layer)</text>

  <!-- 2 / 5a. Transaction -> Primary DB -->
  <path class="edgeg" marker-end="url(#arrowg)" d="M700,240 C860,250 990,258 1055,274"/>
  <text class="etxt" x="748" y="300"><tspan class="num">2.</tspan> Atomic Write + Version</text>
  <text class="etxt" x="748" y="326"><tspan class="num">5a.</tspan> Query Diff</text>

  <!-- 3. Primary DB -> Firestore -->
  <path class="edge" marker-end="url(#arrow)" d="M1140,400 L1140,530"/>
  <text class="etxt" x="1108" y="470" text-anchor="end">3. Real-time trigger</text>

  <!-- 4. Firestore -> Replicache -->
  <path class="edge" marker-end="url(#arrow)" d="M980,585 L830,585 L788,616"/>
  <text class="etxtc" x="870" y="570"><tspan class="numn">4.</tspan> Signals Pull</text>

  <!-- 5. Pull -> Transaction (up, left) -->
  <path class="edgeg" marker-end="url(#arrowg)" d="M455,330 L455,272"/>
  <text class="etxt" x="196" y="303"><tspan class="num">5.</tspan> Request Diff</text>

  <!-- 6. Transaction -> Pull (down, right) -->
  <path class="edgeg" marker-end="url(#arrowg)" d="M545,272 L545,330"/>
  <text class="etxt" x="562" y="303"><tspan class="num">6.</tspan> Return Patch</text>

  <!-- Final: Pull -> Replicache -->
  <path class="edge" marker-end="url(#arrow)" d="M500,398 C540,480 580,540 618,602"/>
  <text class="etxt" x="452" y="470">Final: Merge Patch</text>

  <!-- Background sync: Replicache -> Push (far left) -->
  <path class="edge" marker-end="url(#arrow)" d="M505,642 L136,642 L136,150 L156,163"/>
  <text class="etxt" x="112" y="340" transform="rotate(-90 112 340)" text-anchor="middle">Background Sync</text>

  <!-- Optimistic: UI -> Replicache -->
  <path class="edge" marker-end="url(#arrow)" d="M310,600 C380,622 430,630 498,643"/>
  <text class="etxt" x="320" y="604">Optimistic UI</text>

  <!-- ================= NODES ================= -->
  <!-- Push Endpoint -->
  <rect class="node" x="120" y="96" width="200" height="66" rx="6" stroke="#c58af0"/>
  <text class="ntxt" x="220" y="137" fill="#e6cffb">Push Endpoint</text>

  <!-- Transaction & Versioning (hexagon) -->
  <polygon class="node" points="340,200 660,200 700,235 660,270 340,270 300,235" fill="#3a2f47" stroke="#c58af0"/>
  <text class="ntxt" x="500" y="243" fill="#e6cffb">Transaction &amp; Versioning</text>

  <!-- Pull Endpoint -->
  <rect class="node" x="380" y="330" width="240" height="66" rx="6" stroke="#c58af0"/>
  <text class="ntxt" x="500" y="371" fill="#e6cffb">Pull Endpoint</text>

  <!-- External Sources -->
  <rect class="node" x="990" y="118" width="250" height="66" rx="6" fill="#22402c" stroke="#4caf50"/>
  <text class="ntxt" x="1115" y="159" fill="#a5e3ad">External Sources</text>

  <!-- Primary Database (cylinder) -->
  <path class="node" fill="#3a2f1a" stroke="#e0a94b" d="M1055,285 a85,20 0 0 0 170,0 v100 a85,20 0 0 1 -170,0 z"/>
  <ellipse cx="1140" cy="285" rx="85" ry="20" fill="#3a2f1a" stroke="#e0a94b" stroke-width="2"/>
  <text class="ntxt" x="1140" y="353" fill="#f0cd85">Primary DB</text>

  <!-- User Interface -->
  <rect class="node" x="90" y="556" width="220" height="66" rx="33" stroke="#6f9fd8"/>
  <text class="ntxt" x="200" y="597" fill="#bfd6f2">User Interface</text>

  <!-- Replicache Client (parallelogram) -->
  <polygon class="node" points="520,604 780,604 750,682 490,682" fill="#1f3247" stroke="#6f9fd8"/>
  <text class="ntxt" x="635" y="650" fill="#bfd6f2">Replicache Client</text>

  <!-- Firestore onSnapshot -->
  <rect class="node" x="980" y="530" width="240" height="90" rx="33" stroke="#6f9fd8"/>
  <text class="ntxt" x="1100" y="569" fill="#bfd6f2">Firestore</text>
  <text class="ntxt" x="1100" y="597" fill="#bfd6f2">onSnapshot</text>
</svg>
